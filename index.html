<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лесная Поляна — Склонение существительных</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="forest-bg"></div>

    <header class="app-header">
        <h1>🌲 Лесная Поляна 🌲</h1>
        <p>Склонение существительных</p>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <small>
            <span id="progress-count">0</span> из 72 грибов
        </small>
    </header>

    <main id="game-field" class="game-field"></main>

    <div id="error-cross" class="error-cross hidden">
        ✖ Неправильно! Попробуй ещё раз
    </div>

    <div id="victory-modal" class="modal hidden">
        <div class="modal-content">
            <div class="trophy">🏆</div>
            <h2>Великолепно!</h2>
            <p>Все грибы рассортированы правильно!</p>
            <button id="restart-btn">Сыграть ещё раз</button>
        </div>
    </div>

    <footer class="baskets-container">

        <div id="basket-1" class="basket-item">
            <div class="basket-counter" id="score-1">0</div>
            <div class="basket-handle"></div>
            <div class="basket-body"></div>
            <div class="basket-front-wall">
                <span>1-е склонение</span>
            </div>
        </div>

        <div id="basket-2" class="basket-item">
            <div class="basket-counter" id="score-2">0</div>
            <div class="basket-handle"></div>
            <div class="basket-body"></div>
            <div class="basket-front-wall">
                <span>2-е склонение</span>
            </div>
        </div>

    </footer>

</body>
</html>
